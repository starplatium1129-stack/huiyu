name: Rust Runtime

on:
  push:
    branches: [main]
    paths:
      - 'runtime-rs/**'
      - 'scripts/maintenance/run-rust-runtime.*'
      - 'scripts/maintenance/desktop-rust-inputs.*'
      - 'scripts/lib/delivery-identity.*'
      - 'scripts/workflow.*'
      - 'package*.json'
      - '.github/workflows/rust-runtime.yml'
  pull_request:
    paths:
      - 'runtime-rs/**'
      - 'scripts/maintenance/run-rust-runtime.*'
      - 'scripts/maintenance/desktop-rust-inputs.*'
      - 'scripts/lib/delivery-identity.*'
      - 'scripts/workflow.*'
      - 'package*.json'
      - '.github/workflows/rust-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node for compatibility fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Prepare toolchain and locked Node fixtures
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          else
            rustup toolchain install 1.98.1 --profile minimal
          fi
          rustup default 1.98.1
          npm ci --ignore-scripts
          npm run build:runtime
      - name: Cache Rust dependencies and compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-rs/target
          key: ${{ runner.os }}-runtime-1.98.1-${{ hashFiles('runtime-rs/Cargo.lock') }}-${{ hashFiles('runtime-rs/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-runtime-1.98.1-${{ hashFiles('runtime-rs/Cargo.lock') }}-
      - name: Check Rust runtime
        # Daily source checks are owned by Quality's selected npm test gate.
        if: github.event_name == 'workflow_dispatch'
        run: npm run wf -- rust:check
      - name: Build and verify Node compatibility
        env:
          AICS_RUST_PARITY_REPORT: runtime/rust-evidence/parity.json
        run: |
          npm run wf -- rust:build
          npm run wf -- rust:parity
      - name: Preserve migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-runtime-evidence
          path: runtime/rust-evidence
          if-no-files-found: ignore
          retention-days: 14
