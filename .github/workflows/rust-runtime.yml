name: Rust Runtime

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node for compatibility fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Prepare toolchain and locked Node fixtures
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
          npm ci --ignore-scripts
          npm run build:runtime
      - name: Check Rust runtime
        run: npm run wf -- rust:check
      - name: Build and verify Node compatibility
        env:
          AICS_RUST_PARITY_REPORT: runtime/rust-evidence/parity.json
        run: |
          npm run wf -- rust:build
          npm run wf -- rust:parity
      - name: Preserve migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-runtime-evidence
          path: runtime/rust-evidence
          if-no-files-found: ignore
          retention-days: 14
