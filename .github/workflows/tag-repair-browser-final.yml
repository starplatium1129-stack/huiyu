name: Verify final tag repair browser regressions

on:
  push:
    branches: [codex/tag-inspiration-repair-20260918]
    paths: [.github/workflows/tag-repair-browser-final.yml]

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9cf0db11858296acf8d0ab1ce3196cd5185b5020
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Apply only the reviewed regression changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '9cf0db11858296acf8d0ab1ce3196cd5185b5020'
          p=Path('src/components/director/DirectorTagWorkbench.vue');s=p.read_text();old='type="search" placeholder="搜索中文含义或 Danbooru 英文标签…"'; assert s.count(old)==1;s=s.replace(old,'type="search" aria-label="搜索词条" placeholder="搜索中文含义或 Danbooru 英文标签…"');p.write_text(s)
          p=Path('tests/e2e/studio.spec.ts');s=p.read_text();assert s.count("page.getByPlaceholder('搜索中文或 Danbooru 词条')")==1;s=s.replace("page.getByPlaceholder('搜索中文或 Danbooru 词条')","page.getByRole('searchbox', { name: '搜索词条', exact: true })");old="await page.getByRole('alertdialog').getByRole('button', { name: '确认', exact: true }).click();";assert s.count(old)==1;s=s.replace(old,"await page.getByRole('alertdialog', { name: '离开场景管理？', exact: true })\n    .getByRole('button', { name: '离开页面', exact: true }).click();");p.write_text(s)
          p=Path('tests/e2e/workbench-loading.spec.ts');s=p.read_text();old="page.getByPlaceholder('搜索中文或 Danbooru 词条', { exact: true })";assert s.count(old)==1;p.write_text(s.replace(old,"page.getByRole('searchbox', { name: '搜索词条', exact: true })"))
          p=Path('tests/e2e/office-code.spec.ts');s=p.read_text();old="  const acquire = () => page.evaluate(async () => {";assert s.count(old)==1;new="""  const microphoneAllowed = () => page.evaluate(() => {
              type Policy = { allowsFeature: (feature: string) => boolean }
              const current = document as Document & { permissionsPolicy?: Policy; featurePolicy?: Policy }
              const policy = current.permissionsPolicy ?? current.featurePolicy
              if (!policy) throw new Error('Chromium document permissions policy API is required for this regression')
              return policy.allowsFeature('microphone')
            })
            const acquire = () => page.evaluate(async () => {""";s=s.replace(old,new)
          s=s.replace("      const tracks = stream.getTracks()\n      tracks.forEach", "      const tracks = stream.getTracks()\n      const audioTracks = stream.getAudioTracks().length\n      tracks.forEach",1)
          s=s.replace("return { acquired: true, stopped: tracks.every(track => track.readyState === 'ended'), error: '' }", "return { acquired: true, audioTracks, stopped: tracks.every(track => track.readyState === 'ended'), error: '' }",1)
          s=s.replace("expect(await acquire()).toMatchObject({ acquired: false, error: 'NotAllowedError' })", """// Chromium's rejection name varies (the failing trace reported NotSupportedError
            // alongside a microphone policy violation). Assert the actual document policy
            // and denial, then require a real synthetic audio track on the allowed pages.
            expect(await microphoneAllowed()).toBe(false)
            expect(await acquire()).toMatchObject({ acquired: false })""",1)
          s=s.replace("  expect(await acquire()).toMatchObject({ acquired: true, stopped: true })", "  expect(await microphoneAllowed()).toBe(true)\n  expect(await acquire()).toMatchObject({ acquired: true, audioTracks: 1, stopped: true })",1)
          s=s.replace("  expect((await acquire()).acquired).toBe(false)","  expect(await microphoneAllowed()).toBe(false)\n  expect((await acquire()).acquired).toBe(false)",1)
          s=s.replace("    expect(await acquire()).toMatchObject({ acquired: true, stopped: true })", "    expect(await microphoneAllowed()).toBe(true)\n    expect(await acquire()).toMatchObject({ acquired: true, audioTracks: 1, stopped: true })",1)
          p.write_text(s)
          expected={
              'src/components/director/DirectorTagWorkbench.vue': '9ac88950c71ee7452f6de26306350f961ab312fb',
              'tests/e2e/office-code.spec.ts': '306f711e3c8fa024c4318bed020d9cac06b40e20',
              'tests/e2e/studio.spec.ts': 'c597df6bf5f421d7aa06b92100d2a96cda73bb97',
              'tests/e2e/workbench-loading.spec.ts': '963979adc60a640434094bf1b2c27819482a75c0',
          }
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == sorted(expected)
          for name,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',name],text=True).strip() == sha, name
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add',*expected],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == '9182ec4cf1532a596713d289558c0965149d1e7a'
          PY
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify all seven failing cases and the new random controls
        run: |
          npx playwright test tests/e2e/office-code.spec.ts tests/e2e/studio.spec.ts tests/e2e/workbench-loading.spec.ts --grep 'microphone policy|director separates|scene manager protects|workbench loads'
          npx playwright test tests/e2e/random-inspiration.spec.ts --project=desktop
        env:
          CI: '1'
      - name: Publish the verified commit object without updating any refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, pathlib, os, json, base64, urllib.request
          repo='starplatium1129-stack/huiyu'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          tree_sha='9182ec4cf1532a596713d289558c0965149d1e7a'
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == tree_sha
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          def api(endpoint,data):
              assert endpoint in ('blobs','trees','commits')
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+endpoint,data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          entries=[]
          for name in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              assert name in ['src/components/director/DirectorTagWorkbench.vue','tests/e2e/office-code.spec.ts','tests/e2e/studio.spec.ts','tests/e2e/workbench-loading.spec.ts']
              raw=pathlib.Path(name).read_bytes();blob=api('blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})
              assert blob['sha'] == subprocess.check_output(['git','hash-object',name],text=True).strip()
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('trees',{'base_tree':'9f12cfb570d1a8be314939cc5d49d28135d7c6ed','tree':entries})
          assert tree['sha'] == tree_sha
          message='fix(e2e): align tag search and leave confirmation with live controls\n\nGive the tag search an explicit accessible name and keep real filter\nand draft-retention assertions. Use the existing destructive-action\nlabel in the unsaved-scene guard. Verify microphone policy directly,\nreject capture on denied pages, and require an actual stopped synthetic\naudio track on allowed documents instead of depending on an exception\nname. Preserve response-header, CSP and document-reload assertions.\n\nValidation: local Vue typecheck and lint (no errors); seven formerly\nfailing browser cases and light/dark random controls verified in CI.\nNo permission-policy relaxation, skipped assertions or visual redesign.\n'
          commit=api('commits',{'tree':tree_sha,'parents':['9cf0db11858296acf8d0ab1ce3196cd5185b5020'],'message':message})
          output={'commit':commit['sha'],'tree':tree_sha,'refsUpdated':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'final-browser-candidate.json').write_text(json.dumps(output)+'\n')
          print('CANDIDATE_COMMIT='+commit['sha'])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: final-browser-candidate
          path: ${{ runner.temp }}/final-browser-candidate.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: final-browser-failures
          path: test-results
          retention-days: 1
          if-no-files-found: ignore
