name: Prompt Tag Contracts

on:
  push:
    branches: ['fix/character-tag-escaping-20260924']
  pull_request:
    paths:
      - 'src/utils/prompt*'
      - 'data/popular/**'
      - 'scripts/tests/character-tag-audit.mjs'
      - '.github/workflows/prompt-tag-contracts.yml'

permissions:
  contents: read

concurrency:
  group: prompt-tag-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - name: Audit character identity and standalone series tags
        run: node scripts/tests/character-tag-audit.mjs
      - name: Upload catalogue evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: character-tag-audit
          path: runtime/character-tag-audit/
          retention-days: 7
          if-no-files-found: error
