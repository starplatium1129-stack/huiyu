name: 009 Office Diagnostics
on:
  push:
    branches: ['work/009-office-completion']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve exact source inputs
        run: |
          mkdir -p runtime/009-diagnostics
          git rev-parse HEAD > runtime/009-diagnostics/commit.txt
          git archive --format=tar.gz -o runtime/009-diagnostics/source.tar.gz HEAD AGENTS.md DESIGN.md src scripts tests plans docs package.json package-lock.json tsconfig.json vite.config.ts vitest.config.ts playwright.config.ts playwright.performance.config.ts
      - name: Upload source identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 009-source-inputs
          path: runtime/009-diagnostics
          retention-days: 3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Capture untruncated type diagnostics
        run: npm run typecheck > runtime/009-diagnostics/typecheck.log 2>&1
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 009-type-diagnostics
          path: runtime/009-diagnostics/typecheck.log
          if-no-files-found: warn
          retention-days: 3
