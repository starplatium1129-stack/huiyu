name: Dependency Audit

# 每周依赖安全扫描（2026-08-28 审计 P1-13：门禁盲区补齐）。
# 运行时与完整依赖树都检查；高危/致命阻断，中危保留在 JSON 证据中。
on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC（北京 11:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked dependency tree without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        id: audit-runtime
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > dependency-audit-runtime.json 2> dependency-audit-runtime.stderr
          status=$?
          if [ ! -s dependency-audit-runtime.json ]; then
            AUDIT_OUTPUT=dependency-audit-runtime.json AUDIT_ERROR=dependency-audit-runtime.stderr AUDIT_EXIT_CODE="$status" node <<'NODE'
          const fs = require('node:fs');
          const detail = fs.readFileSync(process.env.AUDIT_ERROR, 'utf8').trim();
          fs.writeFileSync(process.env.AUDIT_OUTPUT, JSON.stringify({
            error: {
              code: 'AUDIT_COMMAND_FAILED',
              exitCode: Number(process.env.AUDIT_EXIT_CODE),
              message: detail || 'npm audit produced no JSON output',
            },
          }, null, 2) + '\n');
          NODE
            status=1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Audit full dependency tree
        id: audit-full
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > dependency-audit.json 2> dependency-audit.stderr
          status=$?
          if [ ! -s dependency-audit.json ]; then
            AUDIT_OUTPUT=dependency-audit.json AUDIT_ERROR=dependency-audit.stderr AUDIT_EXIT_CODE="$status" node <<'NODE'
          const fs = require('node:fs');
          const detail = fs.readFileSync(process.env.AUDIT_ERROR, 'utf8').trim();
          fs.writeFileSync(process.env.AUDIT_OUTPUT, JSON.stringify({
            error: {
              code: 'AUDIT_COMMAND_FAILED',
              exitCode: Number(process.env.AUDIT_EXIT_CODE),
              message: detail || 'npm audit produced no JSON output',
            },
          }, null, 2) + '\n');
          NODE
            status=1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Write dependency audit metadata
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RUNTIME_EXIT_CODE: ${{ steps.audit-runtime.outputs.exit_code || 'not-run' }}
          FULL_EXIT_CODE: ${{ steps.audit-full.outputs.exit_code || 'not-run' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const lock = fs.readFileSync('package-lock.json');
          const npm = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          fs.writeFileSync('dependency-audit-metadata.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            packageLockSha256: crypto.createHash('sha256').update(lock).digest('hex'),
            node: process.version,
            npm,
            scannedAt: new Date().toISOString(),
            installOutcome: process.env.INSTALL_OUTCOME,
            exitCodes: {
              runtime: process.env.RUNTIME_EXIT_CODE,
              full: process.env.FULL_EXIT_CODE,
            },
            diagnostics: {
              runtime: readDiagnostic('dependency-audit-runtime.stderr'),
              full: readDiagnostic('dependency-audit.stderr'),
            },
          }, null, 2) + '\n');
          function readDiagnostic(file) {
            try {
              const text = fs.readFileSync(file, 'utf8').trim();
              return text ? text.slice(-4000) : null;
            } catch {
              return null;
            }
          }
          NODE
      - name: Enforce high-severity audit result
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.audit-runtime.outputs.exit_code }}" = "0"
          test "${{ steps.audit-full.outputs.exit_code }}" = "0"
      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit
          path: |
            dependency-audit-runtime.json
            dependency-audit.json
            dependency-audit-runtime.stderr
            dependency-audit.stderr
            dependency-audit-metadata.json
          if-no-files-found: warn
          retention-days: 14
