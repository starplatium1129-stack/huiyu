name: Nightly visual regression

on:
  schedule:
    # 02:00 Asia/Shanghai; GitHub Actions cron uses UTC.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-visual-e2e
  cancel-in-progress: false

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SPA
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run full theme audit and screenshot matrix
        run: npm run test:e2e:nightly:run
        env:
          CI: '1'
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-visual-review
          # capture.spec.ts writes PNGs under a hidden directory. Opt in only
          # for these screenshots, not arbitrary hidden files in the workspace.
          path: .review-shots/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
