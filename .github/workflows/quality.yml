name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Full gates and critical flows at 02:15 Asia/Shanghai; extended visuals keep their own workflow.
    - cron: '15 18 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref_type != 'tag' }}

env:
  AICS_HYGIENE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  AICS_REFERENCE_AUDIT_MODE: structure
  AICS_TEST_REPORT_DIR: runtime/quality-reports

jobs:
  changed:
    name: Selected Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch only the comparison baseline
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          # Missing/new-branch baselines retain the planner's full fallback.
          base="$AICS_HYGIENE_BASE_REF"
          if [[ "$base" =~ ^([a-fA-F0-9]{40}|[a-fA-F0-9]{64})$ && ! "$base" =~ ^0+$ ]] &&
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "$base" ||
              echo "::warning::Comparison baseline unavailable; running the full fallback suites"
          fi
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Select validation scope
        id: scope
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          let full = ['schedule', 'workflow_dispatch'].includes(process.env.GITHUB_EVENT_NAME);
          let docs = false;
          const base = process.env.AICS_HYGIENE_BASE_REF || '';
          if (!full) {
            try {
              if (!/^(?:[a-f0-9]{40}|[a-f0-9]{64})$/i.test(base) || /^0+$/.test(base)) throw new Error('Invalid baseline');
              execFileSync('git', ['cat-file', '-e', base + '^{commit}']);
              const files = execFileSync('git', ['diff', '--name-only', '-z', base, '--'], { encoding: 'utf8' }).split('\0').filter(Boolean);
              docs = files.length > 0 && files.every(file => /^(docs|plans)\//.test(file)
                || (/\.md$/.test(file) && !/^runtime-rs\/native-/.test(file)));
            } catch (error) {
              console.error('Unavailable comparison baseline; full validation selected:', error.message);
              full = true;
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `full=${full}\ndocs=${docs}\n`);
          NODE
      - name: Validate documentation
        if: steps.scope.outputs.docs == 'true'
        run: |
          git diff --check "$AICS_HYGIENE_BASE_REF" --
          node --experimental-transform-types scripts/maintenance/check-doc-links.ts
      - name: Install dependencies
        if: steps.scope.outputs.docs != 'true'
        run: npm ci
      - name: Plan selected prerequisites
        if: steps.scope.outputs.docs != 'true'
        id: plan
        env:
          FULL_MODE: ${{ steps.scope.outputs.full }}
        run: |
          mkdir -p runtime/quality-checks
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const full = process.env.FULL_MODE === 'true';
          const args = ['scripts/maintenance/gate-quick.js', ...(full ? ['full'] : []), '--plan'];
          const raw = execFileSync(process.execPath, args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] });
          const plan = JSON.parse(raw);
          const prerequisites = plan.prerequisites;
          const keys = ['rustToolchain', 'rustBuild', 'webBuild', 'browser'];
          if (!prerequisites || keys.some(key => typeof prerequisites[key] !== 'boolean')) throw new Error('Invalid gate prerequisites');
          fs.writeFileSync('runtime/quality-checks/plan.json', raw);
          // Mixed UI/data/browser gates build the SPA once inside npm test.
          const gateBuildsUi = plan.areas.some(area => ['ui', 'style', 'data', 'full'].includes(area));
          const outputs = { ...prerequisites, webBuild: prerequisites.webBuild && !gateBuildsUi };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, keys.map(key => `${key}=${full || outputs[key]}`).join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `typecheck=${plan.areas.some(area => ['ui', 'full'].includes(area))}\n`);
          NODE
      - name: Cache frontend compilation information
        if: steps.plan.outputs.typecheck == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/typecheck/app.tsbuildinfo
          # The compiler still checks current inputs; this caches compilation information, never PASS.
          key: ${{ runner.os }}-typecheck-node24-${{ hashFiles('package-lock.json', 'tsconfig.app.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-typecheck-node24-${{ hashFiles('package-lock.json', 'tsconfig.app.json') }}-
      - name: Cache Rust dependencies and compilation
        if: steps.plan.outputs.rustToolchain == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-rs/target
          key: ${{ runner.os }}-runtime-1.98.1-${{ hashFiles('runtime-rs/Cargo.lock') }}-${{ hashFiles('runtime-rs/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-runtime-1.98.1-${{ hashFiles('runtime-rs/Cargo.lock') }}-
      - name: Prepare selected Rust toolchain
        if: steps.plan.outputs.rustToolchain == 'true'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
      - name: Build selected Rust fixture backend
        if: steps.plan.outputs.rustBuild == 'true'
        run: npm run wf -- rust:build
      - name: Build selected browser UI
        # Browser-only edits need dist on a clean runner; mixed/full gates build it themselves.
        if: steps.plan.outputs.webBuild == 'true' && steps.scope.outputs.full != 'true'
        run: npm run build
      - name: Cache Playwright browsers
        if: steps.plan.outputs.browser == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install selected browser runtime
        if: steps.plan.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run selected checks
        if: steps.scope.outputs.docs != 'true'
        env:
          FULL_MODE: ${{ steps.scope.outputs.full }}
        run: |
          set -o pipefail
          if [[ "$FULL_MODE" == true ]]; then
            npm run validate:all -- --verbose 2>&1 | tee runtime/quality-checks/check.log
            npm run test:e2e:critical:run 2>&1 | tee runtime/quality-checks/critical.log
          else
            npm test -- --verbose 2>&1 | tee runtime/quality-checks/check.log
          fi
      - name: Preserve selected diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-selected-results
          path: |
            runtime/quality-checks
            runtime/quality-reports
            test-results
          if-no-files-found: ignore
          retention-days: 14

  minimum-node:
    name: Minimum Node compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build on minimum runtime
        run: npm run build
      - name: Check Node consumer compatibility
        run: node --test scripts/tests/test-api-client.js scripts/tests/test-module-boundaries.mjs scripts/tests/test-runtime-errors.js

  quality-summary:
    name: Quality Summary
    if: always()
    needs: [changed, minimum-node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected quality lane to pass
        env:
          SELECTED_RESULT: ${{ needs.changed.result }}
          MINIMUM_NODE_RESULT: ${{ needs.minimum-node.result }}
          FULL_EVENT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          printf 'selected=%s minimum-node=%s full-event=%s\n' "$SELECTED_RESULT" "$MINIMUM_NODE_RESULT" "$FULL_EVENT"
          test "$SELECTED_RESULT" = success
          if [[ "$FULL_EVENT" == true ]]; then
            test "$MINIMUM_NODE_RESULT" = success
          else
            test "$MINIMUM_NODE_RESULT" = skipped
          fi
