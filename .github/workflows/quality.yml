name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

# 普通验证按分支／PR 收敛（2026-09-10 复核 O4）：连续提交只保留最新一次完整流水线。
# tag 推送可能对应发布验证，不做自动取消；Windows 原生与定时任务各自独立分组。
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  AICS_HYGIENE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  # 参考媒体按项目契约不入 Git；CI 验证索引结构，本机 gate:full 仍逐文件查验。
  AICS_REFERENCE_AUDIT_MODE: structure
  AICS_TEST_REPORT_DIR: runtime/quality-reports

jobs:
  checks:
    name: Static & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 测试直接 require() src/ 下的 .ts（Node 内建类型剥离），需要 22.18+
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SPA
        run: npm run build
      - name: Run static and generated-source checks
        run: npm run check

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-checks
          path: runtime/quality-reports
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: Unit & Coverage Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run frontend unit tests (coverage thresholds enforced)
        run: npx vitest run --coverage
      - name: Run parallel-safe unit suite
        run: npm run test:unit

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-unit
          path: runtime/quality-reports
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: Contract & Gateway Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Contract tests exercise the real SPA fallback and route-specific CSP.
      # Jobs have isolated checkouts; the checks job cannot supply its dist here.
      - name: Build SPA for route contracts
        run: npm run build
      - name: Run controlled contract suite
        run: npm run test:contract

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-contract
          path: runtime/quality-reports
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Browser Regression (Critical)
    needs: [checks, unit, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SPA
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run browser regression
        run: npm run test:e2e:critical:run
        env:
          CI: '1'
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  minimum-node:
    name: Minimum Node compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build on minimum runtime
        run: npm run build
      - name: Check source config and isolated gateway startup
        run: node --test scripts/tests/test-api-client.js scripts/tests/test-module-boundaries.mjs scripts/tests/test-gateway-contract.js

  quality-summary:
    name: Quality Summary
    if: always()
    needs: [checks, unit, contract, e2e, minimum-node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality lane to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          MINIMUM_NODE_RESULT: ${{ needs.minimum-node.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          printf 'checks=%s unit=%s contract=%s e2e=%s\n' "$CHECKS_RESULT" "$UNIT_RESULT" "$CONTRACT_RESULT" "$E2E_RESULT"
          test "$CHECKS_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$CONTRACT_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$MINIMUM_NODE_RESULT" = "success"
