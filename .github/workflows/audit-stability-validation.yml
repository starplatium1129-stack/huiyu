name: Audit stability validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AICS_REFERENCE_AUDIT_MODE: structure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build:runtime && npm run scenes:build && npm run popular:build && npm run blueprints:build
      - name: Reproduce old refresh bugs and apply explicit reviewed patches
        run: node poc/audit-stability-apply.cjs
      - name: Export historical reproduction patch for review
        run: |
          git diff --binary > audit-stability.patch
      - name: Preserve reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-audit-reproduction
          path: |
            audit-stability.patch
            docs/evidence/scene-audit-closeout-2026-09-10/repair-evidence.json
          retention-days: 14
      - name: Complete quality gate in reference-structure mode
        run: npm run wf -- gate:full --all
