<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-nav="PUT-YOUR-NAV-KEY-HERE">
<!--
  ============================================================
  绘遇 HUIYU · 新页面模板
  复制本文件重命名，按注释替换标记即可。

  公约 (按优先级排序):
  1. HTML 标签上不要写 style 属性。样式一律进 <style> 块或 css/*.css；
     只有"数据值"可以留在 HTML，且必须走自定义属性 (形如 --fill:80%)
  2. HTML 标签上不要写 onclick / oninput 这类事件属性，页面里也不要放内嵌脚本块。
     控制器抽成同名外部文件 (page-name.js)，用 addEventListener + 事件委托
     引入时带版本号，形如 page-name.js?v=1
  3. 所有颜色用 var(--xxx) 设计 token，不要写 #XXXXXX
  4. 字号用 var(--fs-*) 档位，不要写字面量 rem
     mono-xs/mono-sm 机读标签 · label-xs/label-sm/label 控件
     body-sm/body/body-lg 正文 · title-xs/title-sm/title 标题 · display h1
  5. 圆角 var(--r-sm|md|lg|xl|2xl|3xl|stage|pill)、间距 var(--s-1) 到 var(--s-8)、
     动效 var(--t-fast|base|slow) + var(--ease-out|in)、层级 var(--z-*)
  6. header 里固定引入: design-system.css / light-theme.css / docs.css / nav.js / theme.js
  7. body 上 data-nav 决定导航高亮项 (scene/director/showcase/…/docs)
  8. 新功能放 tools/，新文档放 docs/
  ============================================================
-->
<head>
<link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面标题 · 绘遇 HUIYU</title>
<!-- ↓ 这 4 行不能省 ↓ -->
<link rel="stylesheet" href="../../../src/assets/css/design-system.css">
<link rel="stylesheet" href="../../../src/assets/css/light-theme.css">
<link rel="stylesheet" href="../../../css/docs.css?v=1">
<script src="../../../tools/nav.js?v=8"></script>
<script src="../../../tools/theme.js?v=5"></script>
<style>
  /* 页面容器: .page / .title / .subtitle 都来自 design-system.css，
     这里只覆写宽度变量。860 用 .page-narrow，1480 用 .page-wide，
     其它值就像下面这样只改 --page-max 一行。 */
  .page { --page-max: 960px; }

  /* ---- 你的自定义样式从这往下写 ----
     先翻一遍 design-system.css，能复用就不要新造:
     .btn(-primary/-ghost/-danger/-sm/-lg/-icon/-block) · .card(-info/-create/-direct)
     .input/.select/.textarea · .field/.field-label/.field-hint · .checkbox-row
     .badge(-success/-warning/-danger/-info/-accent) · .meter/.meter-fill(值走 --fill)
     .chip · .callout(-warn/-danger/-success) · .empty-state · .prompt-code
     .overlay/.modal-card/.modal-head/.modal-actions · .step-list
     .lede/.note/.note-sm/.note-mono/.emphasis/.section-title
     .row/.row-tight/.stack/.stack-sm/.auto-grid(--col-min)/.spread
     .mt-2…mt-6 / .mb-2…mb-5 / .m-0
     需要给某个组件统一改样式时，写 ".my-card p { … }" 这类组件规则，
     不要给每个元素挂一堆工具类，更不要退回内联 style。 */

  .sample-actions { margin-bottom: var(--s-4); }
</style>
</head>
<body data-nav="docs">
<a class="skip-link" href="#main">跳到主要内容</a>

<!-- ========== 导航 (不要改, nav.js 自动渲染) ========== -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand"><span class="sr-only">绘遇 HUIYU</span></div>
    <div class="nav-links"><!-- 自动填充 --></div>
  </div>
</nav>

<!-- ========== 页面正文 ========== -->
<main class="page" id="main" tabindex="-1" aria-label="文档正文">

  <!-- 返回链接 — 改成你要回退到的页面 -->
  <a href="../../index.html" class="nav-back">← 返回</a>

  <!-- 页面标题 -->
  <h1 class="title title-gradient">📄 页面标题</h1>
  <p class="subtitle">这里是副标题，一句话解释这个页面是做什么的。</p>

  <!-- ===== 你的内容从这开始 ===== -->

  <!-- 卡片示例 -->
  <div class="card mb-4">
    <h2 class="mb-2">Lorem Ipsum</h2>
    <p>这是一段示例文本，展示了默认的 <strong>文字层级</strong> 和间距。</p>
  </div>

  <!-- 按钮示例 -->
  <div class="row sample-actions">
    <button type="button" class="btn btn-primary">主要按钮</button>
    <button type="button" class="btn btn-ghost">次要按钮</button>
  </div>

  <!-- 徽章 / Tag 示例 -->
  <div class="row-tight sample-actions">
    <span class="chip">普通 Tag</span>
    <span class="chip active">选中状态</span>
  </div>

  <!-- ===== 内容结束 ===== -->

  <!-- 页脚 -->
  <footer class="footer">
    <p>绘遇 HUIYU · 你的页面</p>
  </footer>

</main>

</body>
</html>
