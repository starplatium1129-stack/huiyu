[package]
name = "ai-cg-studio-desktop"
version = "1.9.1"
edition = "2021"
description = "AI-CG-Studio desktop shell (Tauri 2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ring = "0.17.14"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "=2.13.0" # Re-audit the signature adapter before upgrading.
# Reuse the updater's already-locked HTTP/signature crates; no second transport.
# Updater disables reqwest defaults; explicitly restore ALPN HTTP/2 negotiation
# for release downloads while retaining automatic HTTP/1.1 fallback.
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
windows-sys = { version = "0.59", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "webp"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
live2d-native = { path = "../native-live2d" }
wgpu = "27"
wgpu-types = "27"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"

[profile.release]
opt-level = 2
