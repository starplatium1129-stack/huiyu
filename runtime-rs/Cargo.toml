[package]
name = "huiyu-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["fs", "timeout"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }
sha2 = "0.10"
sha1 = "0.10"
brotli = "8"
flate2 = { version = "1", features = ["zlib-rs"] }
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
ryu-js = "1"
thiserror = "2"
futures-util = "0.3"
http-body = "1"
mime = "0.3"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls", "multipart", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1"
unicode-normalization = "0.1"
regex = "1"
rustxng = { git = "https://github.com/sahenjp/RustXNG.git", rev = "08338038491d57adcfa4990ddf3d8925af292f4e", default-features = false }
icu_collator = "2"
icu_locale = "2"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
libloading = "0.9"
libc = "0.2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.desktop-local]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 16
incremental = true
