[package]
name = "huiyu-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = "0.10"
sha1 = "0.10"
brotli = "8"
flate2 = "1"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
ryu-js = "1"
thiserror = "2"
futures-util = "0.3"
http-body = "1"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls"] }
tokio-tungstenite = "0.29"
unicode-normalization = "0.1"
regex = "1"
icu_collator = "2"
icu_locale = "2"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
libloading = "0.9"
libc = "0.2"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
